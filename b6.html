<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promise Demo</title>
</head>
<body>

<button id="btn">Lấy dữ liệu</button>

<script>

// 1. Tạo Promise mô phỏng lấy dữ liệu (delay 2s)
function getData(){
    return new Promise(function(resolve, reject){

        console.log("Đang lấy dữ liệu...");

        setTimeout(function(){

            let success = true; // đổi thành false để mô phỏng lỗi

            if(success){
                resolve("Dữ liệu lấy thành công!");
            }else{
                reject("Lỗi khi lấy dữ liệu!");
            }

        },2000);

    });
}


// 2. Sử dụng then() và catch()

document.getElementById("btn").addEventListener("click",function(){

    getData()

    .then(function(data){
        console.log(data);
        return data + " -> xử lý bước 1";
    })


// 3. Chain Promises

    .then(function(result){
        console.log(result);
        return result + " -> xử lý bước 2";
    })

    .then(function(result){
        console.log(result);
    })


// 4. Xử lý lỗi tập trung

    .catch(function(error){
        console.log("Có lỗi xảy ra:",error);
    });

});



// 5. Chuyển callback sang Promise

// Callback truyền thống
function tinhTong(a,b,callback){
    setTimeout(function(){
        callback(a+b);
    },1000);
}

// Dạng Promise
function tinhTongPromise(a,b){
    return new Promise(function(resolve,reject){

        setTimeout(function(){

            if(typeof a === "number" && typeof b === "number"){
                resolve(a+b);
            }else{
                reject("Tham số không hợp lệ");
            }

        },1000);

    });
}


// Sử dụng Promise
tinhTongPromise(5,7)
.then(function(result){
    console.log("Tổng =",result);
})
.catch(function(error){
    console.log(error);
});

</script>

</body>
</html>
