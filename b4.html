<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Interaction</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body{
    font-family: Arial;
    text-align: center;
    margin-top: 50px;
}

#box{
    width: 200px;
    height: 100px;
    background-color: lightgray;
    line-height: 100px;
    margin: 20px auto;
    border-radius: 10px;
}

.changeColor{
    background-color: yellow;
}
</style>

<body>

<h2 id="title">Chào bạn!</h2>

<button id="btnClick">Click vào tôi</button>

<div id="box">
    Di chuột vào đây
</div>

<script>
    const button = document.getElementById("btnClick");
const title = document.getElementById("title");
const box = document.getElementById("box");

/* 1. Gán sự kiện click cho nút */
button.addEventListener("click", function(){
    title.textContent = "Bạn vừa click nút!";
});

/* 2. Gán thêm 1 listener khác cho cùng nút */
button.addEventListener("click", function(){
    console.log("Nút đã được click!");
});

/* 3. Toggle class đổi màu nền */
button.addEventListener("click", function(){
    document.body.classList.toggle("changeColor");
});

/* 4. Mouseenter */
box.addEventListener("mouseenter", function(){
    box.textContent = "Chuột đang ở trong box";
});

/* 5. Mouseleave */
box.addEventListener("mouseleave", function(){
    box.textContent = "Chuột đã rời khỏi box";
});
</script>

</body>
</html>
