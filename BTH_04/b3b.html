<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi Step Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.2.1.min.js"></script>
<script src="http://ajax.aspnetcdn.com/ajax/jquery.validate/1.9/jquery.validate.min.js" type="text/javascript"></script>

<style>

.step{
display:none;
}

.step.active{
display:block;
}

.progress{
width:100%;
height:20px;
background:#ddd;
margin-bottom:20px;
}

.progress-bar{
height:100%;
width:33%;
background:#4CAF50;
text-align:center;
color:white;
}

.error{
color:red;
font-size:14px;
}

</style>
</head>

<body>

<h2>Đăng ký tài khoản</h2>

<div class="progress">
<div class="progress-bar" id="progressBar">Bước 1 / 3</div>
</div>

<form id="registerForm">

<!-- STEP 1 -->
<div class="step active" id="step1">

<h3>Bước 1 – Thông tin cá nhân</h3>

<label for="fullname">Họ tên</label>
<input type="text" id="fullname" name="fullname"><br><br>

<label for="birthday">Ngày sinh</label>
<input type="date" id="birthday" name="birthday"><br><br>

<label for="gender">Giới tính</label>
<select id="gender" name="gender">
<option value="">Chọn</option>
<option value="Nam">Nam</option>
<option value="Nữ">Nữ</option>
</select>

<br><br>
<button type="button" id="next1">Tiếp theo</button>

</div>


<!-- STEP 2 -->
<div class="step" id="step2">

<h3>Bước 2 – Thông tin tài khoản</h3>

<label>Email</label>
<input type="email" name="email"><br><br>

<label>Mật khẩu</label>
<input type="password" id="password" name="password"><br><br>

<label>Xác nhận mật khẩu</label>
<input type="password" name="confirm">

<br><br>

<button type="button" id="back1">Quay lại</button>
<button type="button" id="next2">Tiếp theo</button>

</div>


<!-- STEP 3 -->
<div class="step" id="step3">

<h3>Bước 3 – Xác nhận thông tin</h3>

<div id="summary"></div>

<br>

<button type="button" id="back2">Quay lại</button>
<button type="submit">Đăng ký</button>

</div>

</form>

<script src="b3b.js"></script>

</body>
</html>
