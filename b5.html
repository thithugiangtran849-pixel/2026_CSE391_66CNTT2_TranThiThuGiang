<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Handling</title>

<style>
.container{
    padding:40px;
    background-color:lightblue;
}

.box{
    padding:30px;
    background-color:lightgreen;
}

.inner{
    padding:20px;
    background-color:lightcoral;
}

li{
    cursor:pointer;
}
</style>

</head>
<body>

<h2>1. Click Event</h2>
<button id="btn">Click me</button>

<h2>2. Keyboard Event</h2>
<input type="text" id="keyboardInput" placeholder="Nhấn phím bất kỳ">

<h2>3. Form Submit</h2>
<form id="myForm">
    <input type="text" placeholder="Nhập tên">
    <button type="submit">Submit</button>
</form>

<h2>4. Event Bubbling</h2>
<div class="container">
    Container
    <div class="box">
        Box
        <div class="inner">
            Inner
        </div>
    </div>
</div>

<h2>5. Event Delegation</h2>
<ul id="menu">
    <li>Trang chủ</li>
    <li>Sản phẩm</li>
    <li>Dịch vụ</li>
    <li>Liên hệ</li>
</ul>

<script src="b5.js"></script>

</body>
</html>
